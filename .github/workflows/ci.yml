name: build-and-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Контекст сборки это корень репозитория, здесь лежит Dockerfile сервиса
      - run: docker build -t ghcr.io/josefdzeranov/products-service:latest .
      - run: docker push ghcr.io/josefdzeranov/products-service:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Обновляем ТОЛЬКО свой контейнер. --no-deps не трогает db, redis и reviews-service,
      # up -d пересоздает лишь products-service. Остальные сервисы работают нетронутыми.
      # Это и есть независимая выкатка. Системный docker-compose.yml лежит на сервере, его
      # кладет туда инфра-репозиторий dockercourse-deploy.
      - name: Deploy products-service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root
            docker compose pull products-service
            docker compose up -d --no-deps products-service
            docker image prune -f
